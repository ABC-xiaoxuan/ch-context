name: Bug report
description: Report a ch-context problem in CodexHost Web.
title: '[Bug] '
body:
  - type: input
    id: versions
    attributes:
      label: CodexHost and ch-context versions
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, browser and Harness
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Do not include login links, tokens, cookies, private conversation text or credential files.

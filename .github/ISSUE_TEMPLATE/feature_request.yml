name: Feature request
description: Suggest an improvement for ch-context.
title: '[Feature] '
body:
  - type: textarea
    id: request
    attributes:
      label: Desired behavior and use case
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Relevant CodexHost or Harness capabilities
      description: Note which data the Host exposes, if known.

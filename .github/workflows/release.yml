name: Build installable package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:market
      - run: git diff --exit-code -- lib/client.js web/index.mjs web/style.css
      - run: npm run pack:market
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: ch-context-package
          path: |
            dist/ch-context-*.zip
            dist/ch-context-*.sha256
            ch-context-*.tgz

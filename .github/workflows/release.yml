name: Build installable package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- lib/client.js
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: ch-context-package
          path: ch-context-*.tgz
